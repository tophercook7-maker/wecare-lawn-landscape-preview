<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeCare Save Diagnostic</title>
<meta name="robots" content="noindex,nofollow">
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#10201a;color:#e8f0ea;padding:18px;line-height:1.5}
  h1{font-size:1.2rem;color:#7bd88f;margin:0 0 4px}
  .sub{color:#9fb3a8;font-size:.85rem;margin:0 0 14px}
  .row{background:#16281f;border:1px solid #274235;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem;word-break:break-word}
  .k{color:#9fb3a8;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
  .v{font-weight:600;font-size:1rem}
  .ok{color:#7bd88f}.bad{color:#ff8f6b}.warn{color:#ffd479}
  #verdict{font-size:1.05rem;font-weight:700;padding:14px;border-radius:12px;margin-top:12px}
  pre{white-space:pre-wrap;font-size:.8rem;color:#c3d1c9;margin:4px 0 0}
</style>
</head>
<body>
<h1>WeCare — Save Diagnostic</h1>
<p class="sub">Runs on THIS device with your current sign-in. Read me the VERDICT at the bottom.</p>
<div id="out"></div>
<div id="verdict" class="row">Running…</div>

<script>
var URL_="https://fqqbzsxvxpcfwovbunth.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcWJ6c3h2eHBjZndvdmJ1bnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDAwOTIsImV4cCI6MjEwMzYxNjA5Mn0.a62fuRJ19sEGxRN2KtvPkDvS_Ff-NuiYKZAxTZg4Tqg";
var out=document.getElementById("out");
function add(k,v,cls){ out.insertAdjacentHTML("beforeend",'<div class="row"><div class="k">'+k+'</div><div class="v '+(cls||"")+'">'+v+'</div></div>'); }
function verdict(t,cls){ var el=document.getElementById("verdict"); el.className="row "; el.style.background=cls==="bad"?"#3a1d16":(cls==="ok"?"#173b2c":"#3a3418"); el.innerHTML='<span class="'+cls+'">'+t+'</span>'; }
(async function(){
  try{
    // 1. environment
    add("Device", navigator.userAgent);
    var lsOk=true; try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ lsOk=false; }
    add("Local storage works?", lsOk?"YES":"NO — private mode blocks saving", lsOk?"ok":"bad");
    add("Device clock", new Date().toString());
    // 2. session
    var s=null; try{ s=JSON.parse(localStorage.getItem("wecare_session")||"null"); }catch(e){}
    if(!s||!s.access_token){ add("Signed in?","NO session found on this device","bad"); verdict("❌ Not actually signed in on this device — that's why saves fail.","bad"); return; }
    add("Signed in as", s.email||"(unknown)", "ok");
    var expMs=(s.expires_at||0)*1000, now=Date.now();
    add("Token expires", new Date(expMs).toLocaleString()+" ("+Math.round((expMs-now)/60000)+" min from now)", expMs>now?"ok":"bad");
    // 3. the actual write test with THIS device's token
    var id="DIAG-"+Date.now();
    var H={apikey:ANON, Authorization:"Bearer "+s.access_token, "Content-Type":"application/json", Prefer:"return=minimal"};
    var wStatus, wBody="";
    try{
      var wr=await fetch(URL_+"/rest/v1/work_orders?on_conflict=id",{method:"POST",headers:H,body:JSON.stringify({id:id,customer:"__diag__",service:"diag",status:"assigned"})});
      wStatus=wr.status; if(!wr.ok){ wBody=await wr.text(); }
    }catch(e){ wStatus="NETWORK ERROR"; wBody=String(e); }
    add("WRITE result", "HTTP "+wStatus, (wStatus===201||wStatus===200||wStatus===204)?"ok":"bad");
    if(wBody) out.insertAdjacentHTML("beforeend",'<div class="row"><div class="k">server said</div><pre>'+wBody.replace(/</g,"&lt;")+'</pre></div>');
    // 4. read back + cleanup
    if(wStatus===201||wStatus===200||wStatus===204){
      var rd=await fetch(URL_+"/rest/v1/work_orders?id=eq."+id+"&select=id",{headers:{apikey:ANON,Authorization:"Bearer "+s.access_token}}).then(r=>r.json()).catch(()=>[]);
      add("Read back from cloud", (rd&&rd.length)?"FOUND ✓":"not found","(rd&&rd.length)"?"ok":"bad");
      try{ await fetch(URL_+"/rest/v1/work_orders?id=eq."+id,{method:"DELETE",headers:{apikey:ANON,Authorization:"Bearer "+s.access_token}}); }catch(e){}
      verdict("✅ This device CAN save to the cloud. The problem is in the app/tabs, not your login or network.","ok");
    } else if(wStatus===401||wStatus===403){
      verdict("❌ Server REJECTED your login token (HTTP "+wStatus+"). Your sign-in looks valid on screen but isn't accepted by the server — needs a fresh sign-in / token fix.","bad");
    } else if(wStatus==="NETWORK ERROR"){
      verdict("❌ The device couldn't reach the server at all (network/blocked). See error above.","bad");
    } else {
      verdict("⚠️ Unexpected result: HTTP "+wStatus+". Read me the 'server said' box above.","warn");
    }
  }catch(e){ verdict("Diagnostic error: "+String(e),"bad"); }
})();
</script>
</body>
</html>
