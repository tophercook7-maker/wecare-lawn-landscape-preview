<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We Care — Field Ops</title>
<link rel="icon" href="img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#3d8b9a;--teal-deep:#2b6b78;--green:#2f8055;--green-deep:#1f5d3d;--green-ink:#153a2a;--leaf:#7bb03e;
  --ink:#16302a;--body:#33443f;--muted:#6d7d77;--paper:#eef1ee;--surface:#fff;--sand:#f0eee4;--sand2:#e7e4d7;--line:#e0e4e0;
  --ok:#2f8055;--amber:#b5751f;--red:#c1512f;--ff-d:"Fraunces",Georgia,serif;--ff:"Figtree",-apple-system,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--ff);line-height:1.5}
.top{background:linear-gradient(135deg,#173b2c,#2c6d7b);color:#fff;padding:18px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top .b{display:flex;align-items:center;gap:11px;font-family:var(--ff-d);font-size:1.1rem}
.top .b img{height:36px}
.top .nav a{color:#cfe4d6;font-size:.85rem;text-decoration:none;margin-left:14px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
h2{font-family:var(--ff-d);color:var(--green-ink);margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:0 2px 12px rgba(20,48,42,.05)}
.stat .n{font-family:var(--ff-d);font-size:2rem;color:var(--green-deep);line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(20,48,42,.05);margin-bottom:16px}
.panel h2{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.on{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--green)}
.on .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,128,85,.2)}
.wo{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}
.wo .h{display:flex;justify-content:space-between;gap:8px}
.wo .cust{font-weight:700;color:var(--ink)}
.wo .crew{font-size:.82rem;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 9px}
.st-assigned{background:#eef1ee;color:var(--muted)}.st-enroute{background:rgba(64,143,158,.15);color:var(--teal-deep)}
.st-arrived{background:rgba(181,117,31,.15);color:var(--amber)}.st-started{background:rgba(148,204,79,.2);color:var(--green-deep)}
.st-done{background:rgba(47,128,85,.2);color:var(--green)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--green-deep)}
.btn.p{background:var(--teal);color:#fff;border-color:var(--teal)}
.field{margin-bottom:9px}.field label{display:block;font-size:.8rem;font-weight:600;color:var(--green-deep);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:var(--ff);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{font-size:.82rem;background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.chips input{margin-right:4px}
.mini{font-size:.82rem;color:var(--muted)}
.export{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--green-deep)}
.fix{background:#fdf6ea;border:1px solid #e6cd97;border-radius:9px;padding:10px 13px;margin-bottom:8px;font-size:.88rem}
.empty{color:var(--muted);font-style:italic;font-size:.86rem;padding:8px 0}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="b"><img src="img/mark-trans.png" alt="We Care"> <span style="color:#fff">We Care · Field Ops</span></div>
  <div class="nav"><a href="estimate.html">Estimator</a><a href="crew.html">Crew app</a><a href="dashboard.html">Leads / CRM</a><a href="index.html">Website</a></div>
</div></div>

<div class="wrap" style="padding-bottom:50px">
  <div class="stats" id="stats"></div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>🟢 On the clock now</h2>
        <div id="onclock"></div>
      </div>
      <div class="panel">
        <h2>Weekly payroll hours <button class="export" onclick="exportCSV()">⬇ CSV</button></h2>
        <p class="mini" style="margin-top:-2px">Week to date · overtime after <input id="otAfter" type="number" value="40" style="width:52px;padding:2px 6px;border:1px solid var(--line);border-radius:6px"> hrs</p>
        <div id="hours"></div>
      </div>
      <div class="panel">
        <h2>✏️ Punch-fix requests</h2>
        <div id="fixes"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>Today's work orders</h2>
        <div id="orders"></div>
      </div>
      <div class="panel">
        <h2>➕ New work order</h2>
        <div class="field"><label>Customer</label><input id="woCust" placeholder="Name"></div>
        <div class="field"><label>Service</label><select id="woSvc"><option>Lawn maintenance</option><option>Landscape design/build</option><option>Concrete Artistry</option><option>Sod install</option><option>Drainage</option><option>Irrigation</option><option>Water feature</option><option>Hardscape/patio</option></select></div>
        <div class="field"><label>Address</label><input id="woAddr" placeholder="Street, town"></div>
        <div class="field"><label>Scope of work</label><textarea id="woScope" rows="2" placeholder="What's being done…"></textarea></div>
        <div class="field"><label>Assign crew</label><div class="chips" id="woCrew"></div></div>
        <div class="field"><label>Est. labor hours</label><input id="woHrs" type="number" step="0.5" placeholder="e.g. 4"></div>
        <button class="btn p" onclick="createWO()" style="width:100%">Create &amp; assign</button>
      </div>
    </div>
  </div>
</div>

<script src="js/wecare-cloud.js"></script>
<script>
var CREW=[
  {id:"derrick",name:"Derrick Collier",role:"Owner & Operations Director",admin:true},
  {id:"jason",name:"Jason Kennedy",role:"Landscape Production Manager"},
  {id:"hayden",name:"Hayden Collier",role:"Landscape Installation Tech"},
  {id:"justin",name:"Justin Cavenza",role:"Landscape Installation Tech"},
  {id:"christian",name:"Christian Benton",role:"Maintenance Technician"},
  {id:"chris",name:"Chris Crain",role:"Maintenance Technician"},
];
var K_PUNCH="wecare_punches",K_JOBS="wecare_workorders",K_FIX="wecare_punch_fixes";
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function nm(id){var c=CREW.find(function(x){return x.id===id});return c?c.name:id}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmtDur(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h+":"+String(m).padStart(2,"0")}
function weekStart(){var d=new Date();var day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.getTime()}

function render(){
  var punches=load(K_PUNCH,[]),jobs=load(K_JOBS,[]),fixes=load(K_FIX,[]);
  // on the clock
  var open=punches.filter(function(p){return !p.out});
  document.getElementById("onclock").innerHTML = open.length ? open.map(function(p){
    var job=jobs.find(function(j){return j.id===p.jobId});
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">'+
      '<span class="on"><span class="dot"></span>'+esc(p.empName)+'</span>'+
      '<span class="mini">'+(job?esc(job.customer):'—')+' · '+fmtDur(Date.now()-new Date(p.in).getTime())+(p.inGeo?' · 📍':'')+'</span></div>';
  }).join("") : '<div class="empty">Nobody clocked in right now.</div>';

  // weekly hours
  var ws=weekStart(),ot=parseFloat(document.getElementById("otAfter").value)||40,tot={};
  punches.forEach(function(p){ if(!p.out)return; var t0=new Date(p.in).getTime(); if(t0<ws)return;
    tot[p.empId]=(tot[p.empId]||0)+(new Date(p.out).getTime()-t0)/3600000; });
  var rows=CREW.filter(function(c){return tot[c.id]}).map(function(c){
    var h=tot[c.id],reg=Math.min(h,ot),o=Math.max(0,h-ot);
    return '<tr><td>'+esc(c.name)+'</td><td class="num">'+reg.toFixed(1)+'</td><td class="num">'+(o>0?o.toFixed(1):'—')+'</td><td class="num"><b>'+h.toFixed(1)+'</b></td></tr>';
  }).join("");
  document.getElementById("hours").innerHTML = rows ?
    '<table><tr><th>Employee</th><th class="num">Reg</th><th class="num">OT</th><th class="num">Total</th></tr>'+rows+'</table>'
    : '<div class="empty">No hours logged this week yet.</div>';

  // orders
  var today=new Date().toISOString().slice(0,10);
  var td=jobs.filter(function(j){return j.date===today});
  document.getElementById("orders").innerHTML = td.length ? td.map(function(j){
    return '<div class="wo"><div class="h"><span class="cust">'+esc(j.customer)+'</span><span class="pill st-'+(j.status||'assigned')+'">'+(j.status||'assigned')+'</span></div>'+
      '<div class="mini">'+esc(j.service)+' · '+esc(j.address)+'</div>'+
      '<div class="crew">👷 '+(j.assignedTo||[]).map(nm).join(", ")+(j.estHours?' · est '+j.estHours+'h':'')+'</div>'+
      reviewControls(j)+'</div>';
  }).join("") : '<div class="empty">No work orders today. Create one →</div>';

  // fixes
  var pend=fixes.filter(function(f){return !f.resolved});
  document.getElementById("fixes").innerHTML = pend.length ? pend.map(function(f){
    return '<div class="fix"><b>'+esc(f.empName)+':</b> '+esc(f.note)+'<br><button class="btn" style="margin-top:6px;padding:4px 10px" onclick="resolveFix(\''+f.id+'\')">Mark handled</button></div>';
  }).join("") : '<div class="empty">No pending punch-fix requests.</div>';

  // stats
  document.getElementById("stats").innerHTML=
    stat(open.length,"On the clock")+
    stat(td.length,"Jobs today")+
    stat(td.filter(function(j){return j.status==='done'}).length,"Jobs done")+
    stat(Object.values(tot).reduce(function(a,b){return a+b},0).toFixed(0),"Crew hrs this wk");
}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}

function reviewControls(j){
  if((j.status||"")!=="done") return "";   // only completed jobs
  var bar='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">';
  if(!j.paid){
    return bar+'<button class="btn" onclick="markPaid(\''+j.id+'\')">💵 Mark paid → request review</button></div>';
  }
  var rs=j.reviewStatus||"requested";
  if(rs==="hold") return bar+'<span class="pill" style="background:rgba(193,81,47,.14);color:var(--red)">⏸ Review on hold (issue)</span> <button class="btn" style="padding:5px 10px" onclick="setReview(\''+j.id+'\',\'requested\')">▶ Release request</button></div>';
  if(rs==="done") return bar+'<span class="pill st-done">⭐ Reviewed ✓</span></div>';
  // requested
  return bar+'<span class="pill st-started">⭐ Review requested</span> '+
    '<button class="btn" style="padding:5px 10px" onclick="setReview(\''+j.id+'\',\'hold\')">⏸ Hold (issue)</button> '+
    '<button class="btn" style="padding:5px 10px" onclick="setReview(\''+j.id+'\',\'done\')">✓ Got the review</button></div>';
}
function markPaid(id){var j=load(K_JOBS,[]);var x=j.find(function(y){return y.id===id});if(x){x.paid=true;x.reviewStatus="requested";}save(K_JOBS,j);render();}
function setReview(id,st){var j=load(K_JOBS,[]);var x=j.find(function(y){return y.id===id});if(x)x.reviewStatus=st;save(K_JOBS,j);render();}
function createWO(){
  var cust=document.getElementById("woCust").value.trim(); if(!cust){alert("Customer name?");return;}
  var crew=[].slice.call(document.querySelectorAll("#woCrew input:checked")).map(function(i){return i.value});
  var jobs=load(K_JOBS,[]);
  jobs.push({id:"W"+Date.now().toString(36),customer:cust,service:document.getElementById("woSvc").value,
    address:document.getElementById("woAddr").value.trim(),scope:document.getElementById("woScope").value.trim(),
    sop:document.getElementById("woSvc").value+" SOP",assignedTo:crew,date:new Date().toISOString().slice(0,10),
    status:"assigned",estHours:parseFloat(document.getElementById("woHrs").value)||null});
  save(K_JOBS,jobs);
  ["woCust","woAddr","woScope","woHrs"].forEach(function(id){document.getElementById(id).value=""});
  document.querySelectorAll("#woCrew input:checked").forEach(function(i){i.checked=false});
  render();
}
function resolveFix(id){var f=load(K_FIX,[]);var x=f.find(function(y){return y.id===id});if(x)x.resolved=true;save(K_FIX,f);render();}
function exportCSV(){
  var ws=weekStart(),ot=parseFloat(document.getElementById("otAfter").value)||40,tot={};
  load(K_PUNCH,[]).forEach(function(p){if(!p.out)return;var t0=new Date(p.in).getTime();if(t0<ws)return;tot[p.empId]=(tot[p.empId]||0)+(new Date(p.out).getTime()-t0)/3600000;});
  var rows=["Employee,Regular,Overtime,Total"];
  CREW.forEach(function(c){if(!tot[c.id])return;var h=tot[c.id],reg=Math.min(h,ot),o=Math.max(0,h-ot);rows.push('"'+c.name+'",'+reg.toFixed(2)+','+o.toFixed(2)+','+h.toFixed(2));});
  var b=new Blob([rows.join("\n")],{type:"text/csv"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="wecare-payroll-week.csv";a.click();
}
document.getElementById("woCrew").innerHTML=CREW.map(function(c){return '<label><input type="checkbox" value="'+c.id+'">'+c.name.split(" ")[0]+'</label>'}).join("");
document.getElementById("otAfter").addEventListener("input",render);
window.addEventListener("storage",render);
setInterval(render,5000);
render();
</script>
</body>
</html>
