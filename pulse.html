<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeCare Landscapes — Owner Home</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/mark.png">
<link rel="manifest" href="owner-manifest.json">
<meta name="theme-color" content="#1f5d3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WeCare Landscapes Owner">
<link rel="apple-touch-icon" href="img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#3d8b9a;--teal-deep:#2b6b78;--green:#2f8055;--green-deep:#1f5d3d;--green-ink:#153a2a;--leaf:#7bb03e;
  --ink:#16302a;--body:#33443f;--muted:#6d7d77;--paper:#eef1ee;--surface:#fff;--sand:#f0eee4;--line:#e0e4e0;
  --ok:#2f8055;--amber:#b5751f;--red:#c1512f;--ff-d:"Fraunces",Georgia,serif;--ff:"Figtree",-apple-system,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10201a;--surface:#16281f;--sand:#1a2f25;--line:#274235;--ink:#eef4f0;--body:#c3d1c9;--muted:#8fa298;--green-ink:#eaf5ee;--green-deep:#8fe0b0;}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--ff);line-height:1.5}
.top{background:linear-gradient(135deg,#173b2c,#2c6d7b);color:#fff;padding:18px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top .b{display:flex;align-items:center;gap:11px;font-family:var(--ff-d);font-size:1.1rem}
.top .b img{height:34px}
.top .nav a{color:#cfe4d6;font-size:.85rem;text-decoration:none;margin-left:14px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
h1{font-family:var(--ff-d);color:var(--green-ink);font-size:1.5rem;margin:24px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,48,42,.05)}
.tile .n{font-family:var(--ff-d);font-size:2rem;color:var(--green-ink);line-height:1}
.tile .l{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.tile .s{font-size:.8rem;color:var(--teal-deep);margin-top:4px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-family:var(--ff-d);color:var(--green-ink);font-size:1.1rem;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.row:last-child{border:0}
.row b{color:var(--ink)}
.attn{background:#fdf6ea;border:1px solid #e6cd97;border-radius:10px;padding:6px 11px;font-size:.82rem;color:#7a5a1f;font-weight:600;display:inline-block;margin:3px 4px 3px 0}
.attn.zero{background:rgba(47,128,85,.12);border-color:rgba(47,128,85,.3);color:var(--ok)}
.attn a{color:inherit;text-decoration:none}
.empty{color:var(--muted);font-style:italic;font-size:.86rem;padding:6px 0}
.mini{color:var(--muted);font-size:.82rem}
.go{display:inline-block;margin-top:10px;font-size:.85rem;font-weight:700;color:var(--teal-deep);text-decoration:none}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="b"><img src="img/mark-trans.png" alt="WeCare Landscapes"> <span style="color:#fff">WeCare Landscapes · Owner Home</span></div>
  <div class="nav"><a href="dashboard.html">Leads / CRM</a><a href="ops.html">Field Ops</a><a href="crew.html">Crew app</a><a href="index.html">Website</a></div>
</div></div>

<div class="wrap" style="padding-bottom:50px">
  <h1 id="hello">This week at WeCare Landscapes</h1>
  <div class="sub" id="range"></div>
  <div class="tiles" id="tiles"></div>

  <div class="cols">
    <div class="panel">
      <h2>🗓️ Today</h2>
      <div id="today"></div>
    </div>
    <div class="panel">
      <h2>⚡ Needs attention</h2>
      <div id="attn"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2>📈 This week's numbers</h2>
    <div id="numbers"></div>
    <a class="go" href="ops.html">Open Field Ops →</a> &nbsp; <a class="go" href="dashboard.html">Open Leads / CRM →</a>
  </div>
</div>

<script src="js/wecare-auth.js?v=0830"></script>
<script>WeCareAuth.guard();</script>
<script src="js/wecare-cloud.js?v=0830"></script>
<script>
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function arr(k){var r=load(k,[]);return Array.isArray(r)?r:(r?Object.keys(r).map(function(i){return r[i]}):[]);}
function money(n){return "$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function weekStart(){var d=new Date();var day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.getTime();}
var FU_INTERVALS=[1,3,7,14];
function fuDue(l){
  if(l.stage==="Won"||l.fuStop) return false;
  var t=l.touches||[]; if(t.length>=FU_INTERVALS.length) return false;
  var base=t.length?new Date(t[t.length-1]).getTime():new Date(l.created).getTime();
  return Date.now() >= base+FU_INTERVALS[t.length]*86400000;
}
function fmtTime(t){if(!t)return"";if(t==="AM")return "AM (9–12)";if(t==="PM")return "PM (12–3)";var p=t.split(":"),h=+p[0],m=p[1]||"00",ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+m+" "+ap;}

function render(){
  var today=new Date().toISOString().slice(0,10), ws=weekStart();
  var jobs=arr("wecare_workorders"), punches=arr("wecare_punches"),
      leads=arr("wecare_leads"), consults=arr("wecare_consults");

  // week jobs + revenue + hours
  var weekJobs=jobs.filter(function(j){return j.date && new Date(j.date+"T12:00:00").getTime()>=ws;});
  var doneWeek=weekJobs.filter(function(j){return j.status==="done";});
  var revenue=weekJobs.reduce(function(a,j){return a+(parseFloat(j.price)||0);},0);
  var hours=punches.reduce(function(a,p){ if(!p.out)return a; var t0=new Date(p.in).getTime(); if(t0<ws)return a; return a+(new Date(p.out).getTime()-t0)/3600000; },0);
  var newLeads=leads.filter(function(l){return l.stage==="New";}).length;
  var dueFU=leads.filter(fuDue).length;
  var upConsults=consults.filter(function(c){return c.status!=="completed"&&c.status!=="canceled"&&(!c.date||c.date>=today);});
  var reqConsults=consults.filter(function(c){return c.status==="requested";}).length;
  var reviewReq=jobs.filter(function(j){return j.reviewStatus==="requested";}).length;
  var fixes=arr("wecare_punch_fixes").filter(function(f){return !f.resolved;}).length;

  document.getElementById("range").textContent="Week of "+new Date(ws).toLocaleDateString("en-US",{month:"long",day:"numeric"});
  document.getElementById("tiles").innerHTML=
    tile(doneWeek.length+"/"+weekJobs.length,"Jobs done / scheduled","")+
    tile(hours.toFixed(1),"Crew hours logged","")+
    tile(money(revenue),"Booked this week", revenue?"":"add job prices in Ops")+
    tile(newLeads,"New leads waiting", newLeads?"follow up →":"all caught up");

  // today
  var tj=jobs.filter(function(j){return j.date===today;});
  var tc=upConsults.filter(function(c){return c.date===today;});
  var th="";
  if(tj.length||tc.length){
    th+=tj.map(function(j){return '<div class="row"><span>🧰 '+esc(j.customer)+' <span class="mini">· '+esc(j.service)+'</span></span><b>'+esc(j.status||"assigned")+'</b></div>';}).join("");
    th+=tc.map(function(c){return '<div class="row"><span>📅 '+esc(c.name)+' <span class="mini">· consult</span></span><b>'+(c.time?fmtTime(c.time):"—")+'</b></div>';}).join("");
  } else th='<div class="empty">Nothing scheduled today.</div>';
  document.getElementById("today").innerHTML=th;

  // needs attention
  function chip(n,label,href){ var z=n===0; return '<a class="attn'+(z?' zero':'')+'" href="'+href+'">'+(z?'✓ ':'')+n+' '+label+'</a>'; }
  document.getElementById("attn").innerHTML=
    chip(dueFU,"follow-ups due","dashboard.html")+
    chip(reqConsults,"booking requests","dashboard.html")+
    chip(newLeads,"new leads","dashboard.html")+
    chip(reviewReq,"review requests","ops.html")+
    chip(fixes,"punch fixes","ops.html");

  // week numbers
  var wonWeek=leads.filter(function(l){return l.stage==="Won";}).length;
  document.getElementById("numbers").innerHTML=
    numrow("Jobs scheduled this week",weekJobs.length)+
    numrow("Jobs completed",doneWeek.length)+
    numrow("Crew hours logged",hours.toFixed(1))+
    numrow("Revenue booked",money(revenue))+
    numrow("Consultations coming up",upConsults.length)+
    numrow("Leads in the pipeline",leads.length)+
    numrow("Won (all time)",wonWeek);
}
function tile(n,l,s){return '<div class="tile"><div class="n">'+n+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';}
function numrow(l,v){return '<div class="row"><span>'+l+'</span><b>'+v+'</b></div>';}

window.addEventListener("storage",render);
setInterval(render,5000);
render();
</script>
<script src="js/wecare-onboard.js?v=0830"></script>
</body>
</html>
