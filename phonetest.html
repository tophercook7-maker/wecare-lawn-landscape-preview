<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>WeCare Phone Test 3</title>
<style>
 body{font-family:-apple-system,Roboto,sans-serif;margin:0;background:#10201a;color:#e8f0ea;padding:16px;line-height:1.5}
 h1{color:#7bd88f;font-size:1.15rem;margin:0 0 10px}
 .row{background:#16281f;border:1px solid #274235;border-radius:10px;padding:9px 11px;margin:7px 0;font-size:.9rem;word-break:break-word}
 .k{color:#9fb3a8;font-size:.72rem;text-transform:uppercase}.v{font-weight:700;font-size:1.05rem}
 .ok{color:#7bd88f}.bad{color:#ff8f6b}.warn{color:#ffd479}
 #verdict{font-size:1.05rem;font-weight:800;padding:14px;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<h1>WeCare — Phone Test 3</h1>
<div id="out"></div>
<div id="verdict" class="row">Running… ~20 seconds, then screenshot.</div>
<script>
var out=document.getElementById("out");
function add(k,v,c){ out.insertAdjacentHTML("beforeend",'<div class="row"><div class="k">'+k+'</div><div class="v '+(c||"")+'">'+v+'</div></div>'); }
function verdict(t,c){ var e=document.getElementById("verdict"); e.style.background=c==="bad"?"#3a1d16":(c==="ok"?"#173b2c":"#3a3418"); e.innerHTML='<span class="'+c+'">'+t+'</span>'; }
var URL_="https://fqqbzsxvxpcfwovbunth.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcWJ6c3h2eHBjZndvdmJ1bnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDAwOTIsImV4cCI6MjEwMzYxNjA5Mn0.a62fuRJ19sEGxRN2KtvPkDvS_Ff-NuiYKZAxTZg4Tqg";
function timed(p,ms){ return new Promise(function(res){ var d=false,t=setTimeout(function(){if(!d){d=true;res({hung:true});}},ms); p.then(function(r){if(!d){d=true;clearTimeout(t);res({r:r});}}).catch(function(e){if(!d){d=true;clearTimeout(t);res({err:String(e)});}}); }); }
function show(label,o){ add(label, o.hung?"HUNG (10s, no response)":(o.err?("ERROR "+o.err):("HTTP "+o.r.status)), (o.r&&o.r.ok)?"ok":"bad"); return o; }
(async function(){
 try{
  var s=null; try{ s=JSON.parse(localStorage.getItem("wecare_session")||"null"); }catch(e){}
  if(!s||!s.access_token){ verdict("❌ Not signed in on this phone.","bad"); return; }
  var tok=s.access_token, H={apikey:ANON, Authorization:"Bearer "+tok, "Content-Type":"application/json"};
  add("Signed in", s.email||"yes","ok");

  // A: the header combo that worked before
  var idA="A-"+Date.now();
  var A=show("WRITE A  (Prefer: return=minimal)", await timed(fetch(URL_+"/rest/v1/work_orders?on_conflict=id",{method:"POST",headers:Object.assign({},H,{Prefer:"return=minimal"}),body:JSON.stringify({id:idA,customer:"__A__",service:"t",status:"assigned"})}),10000));
  if(A.r&&A.r.ok){try{await fetch(URL_+"/rest/v1/work_orders?id=eq."+idA,{method:"DELETE",headers:H});}catch(e){}}

  // B: EXACTLY what the app sends
  var idB="B-"+Date.now();
  var B=show("WRITE B  (app's: resolution=merge-duplicates,return=minimal)", await timed(fetch(URL_+"/rest/v1/work_orders?on_conflict=id",{method:"POST",headers:Object.assign({},H,{Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({id:idB,customer:"__B__",service:"t",status:"assigned"})}),10000));
  if(B.r&&B.r.ok){try{await fetch(URL_+"/rest/v1/work_orders?id=eq."+idB,{method:"DELETE",headers:H});}catch(e){}}

  var aok=A.r&&A.r.ok, bok=B.r&&B.r.ok;
  if(aok&&bok) verdict("✅ Both writes work. The app write is fine — the office issue is elsewhere (stale tab).","ok");
  else if(aok&&!bok) verdict("🎯 FOUND IT: the app's header combo (B) "+(B.hung?"HANGS":"fails")+" on this phone, but the simple one (A) works. I'll change the app to use A.","warn");
  else verdict("Both had trouble: A="+(A.hung?"hung":(A.err?"err":A.r.status))+" B="+(B.hung?"hung":(B.err?"err":B.r.status)),"bad");
 }catch(e){ verdict("Error: "+e,"bad"); }
})();
</script>
</body>
</html>
