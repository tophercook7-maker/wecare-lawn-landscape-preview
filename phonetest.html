<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>WeCare Phone Test 2</title>
<style>
 body{font-family:-apple-system,Roboto,sans-serif;margin:0;background:#10201a;color:#e8f0ea;padding:16px;line-height:1.5}
 h1{color:#7bd88f;font-size:1.15rem;margin:0 0 10px}
 .row{background:#16281f;border:1px solid #274235;border-radius:10px;padding:9px 11px;margin:7px 0;font-size:.9rem;word-break:break-word}
 .k{color:#9fb3a8;font-size:.72rem;text-transform:uppercase}.v{font-weight:700;font-size:1.05rem}
 .ok{color:#7bd88f}.bad{color:#ff8f6b}.warn{color:#ffd479}
 #verdict{font-size:1.05rem;font-weight:800;padding:14px;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<h1>WeCare — Phone Test 2</h1>
<div id="out"></div>
<div id="verdict" class="row">Running… wait ~12 seconds, then screenshot this whole screen.</div>
<script>
var out=document.getElementById("out");
function add(k,v,c){ out.insertAdjacentHTML("beforeend",'<div class="row"><div class="k">'+k+'</div><div class="v '+(c||"")+'">'+v+'</div></div>'); }
function verdict(t,c){ var e=document.getElementById("verdict"); e.style.background=c==="bad"?"#3a1d16":(c==="ok"?"#173b2c":"#3a3418"); e.innerHTML='<span class="'+c+'">'+t+'</span>'; }
var URL_="https://fqqbzsxvxpcfwovbunth.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxcWJ6c3h2eHBjZndvdmJ1bnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDAwOTIsImV4cCI6MjEwMzYxNjA5Mn0.a62fuRJ19sEGxRN2KtvPkDvS_Ff-NuiYKZAxTZg4Tqg";
function withTimeout(promise, ms, label){
  return new Promise(function(resolve){
    var done=false, t=setTimeout(function(){ if(!done){done=true; resolve({hung:true, label:label});} }, ms);
    promise.then(function(r){ if(!done){done=true; clearTimeout(t); resolve({res:r});} })
           .catch(function(e){ if(!done){done=true; clearTimeout(t); resolve({err:String(e)});} });
  });
}
(async function(){
 try{
  add("Online?", navigator.onLine?"yes":"NO", navigator.onLine?"ok":"bad");
  var s=null; try{ s=JSON.parse(localStorage.getItem("wecare_session")||"null"); }catch(e){}
  add("Signed in", s&&s.access_token?(s.email||"yes"):"NO", s&&s.access_token?"ok":"bad");
  if(!s||!s.access_token){ verdict("❌ Not signed in on this phone.","bad"); return; }
  var tok=s.access_token;

  // TEST A: direct authenticated READ (GET) with timeout
  var ra=await withTimeout(fetch(URL_+"/rest/v1/work_orders?select=id&limit=1",{headers:{apikey:ANON,Authorization:"Bearer "+tok}}), 10000, "read");
  add("READ (GET) result", ra.hung?"HUNG (no response in 10s)":(ra.err?("ERROR "+ra.err):("HTTP "+ra.res.status)), (ra.res&&ra.res.ok)?"ok":"bad");

  // TEST B: direct authenticated WRITE (POST) with timeout — the real question
  var id="DW-"+Date.now();
  var body=JSON.stringify({id:id,customer:"__phonewrite__",service:"t",status:"assigned"});
  var rb=await withTimeout(fetch(URL_+"/rest/v1/work_orders?on_conflict=id",{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"return=minimal"},body:body}), 10000, "write");
  var wline = rb.hung?"HUNG (no response in 10s)":(rb.err?("ERROR "+rb.err):("HTTP "+rb.res.status));
  add("WRITE (POST) result", wline, (rb.res&&rb.res.ok)?"ok":"bad");

  // cleanup if it wrote
  if(rb.res&&rb.res.ok){ try{ await fetch(URL_+"/rest/v1/work_orders?id=eq."+id,{method:"DELETE",headers:{apikey:ANON,Authorization:"Bearer "+tok}}); }catch(e){} }

  if(rb.res&&rb.res.ok) verdict("✅ Direct WRITE works ("+rb.res.status+"). The office app should save — likely a stale app tab. ","ok");
  else if(rb.hung) verdict("❌ The WRITE request HANGS on this phone (READ was: "+(ra.hung?"also hung":"ok")+"). Something on this device/network is blocking POSTs to the server.","bad");
  else verdict("❌ WRITE failed: "+wline+". Reported.","bad");
 }catch(e){ verdict("Error: "+e,"bad"); }
})();
</script>
</body>
</html>
