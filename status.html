<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your WeCare Landscapes Booking</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal-deep:#2b6b78;--green:#2f8055;--green-deep:#1f5d3d;--green-ink:#153a2a;--ink:#16302a;--body:#33443f;--muted:#6d7d77;--line:#e0e4e0;--paper:#eef1ee;--surface:#fff;--amber:#b5751f;--red:#c1512f;--ff-d:"Fraunces",Georgia,serif;--ff:"Figtree",-apple-system,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10201a;--surface:#16281f;--line:#274235;--ink:#eef4f0;--body:#c3d1c9;--muted:#8fa298;--green-ink:#eaf5ee;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#173b2c,#2c6d7b);color:var(--body);font-family:var(--ff);display:grid;place-items:center;padding:24px}
.card{background:var(--surface);border-radius:18px;max-width:440px;width:100%;padding:30px 28px;box-shadow:0 24px 60px rgba(20,48,42,.3);text-align:center}
.logo{height:52px;margin-bottom:6px}
h1{font-family:var(--ff-d);color:var(--green-ink);font-size:1.4rem;margin:6px 0 2px}
.step{display:inline-block;font-weight:700;border-radius:999px;padding:6px 16px;margin:14px 0;font-size:.95rem}
.s-requested{background:rgba(181,117,31,.15);color:var(--amber)}
.s-confirmed{background:rgba(47,128,85,.16);color:var(--green)}
.s-completed{background:rgba(47,128,85,.16);color:var(--green)}
.s-canceled{background:rgba(193,81,47,.14);color:var(--red)}
.det{background:var(--paper);border-radius:12px;padding:14px 16px;margin:14px 0;text-align:left;font-size:.95rem}
.det .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.det .r span{color:var(--muted)}
.msg{color:var(--body);font-size:.95rem;margin:8px 0}
.call{display:inline-block;margin-top:12px;background:linear-gradient(135deg,var(--green-deep),var(--teal-deep));color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
.foot{color:var(--muted);font-size:.8rem;margin-top:16px}
</style>
</head>
<body>
<div class="card" id="card"><div class="msg">Loading your booking…</div></div>
<script src="js/wecare-cloud.js?v=0842"></script>
<script>
function q(k){return new URLSearchParams(location.search).get(k);}
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}catch(e){return d;}}
function fmtTime(t){if(!t)return"";if(t==="AM")return "Morning (9–12)";if(t==="PM")return "Afternoon (12–3)";var p=t.split(":"),h=+p[0],m=p[1]||"00",ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+m+" "+ap;}
var id=q("c");
var STEP={requested:["s-requested","Request received"],confirmed:["s-confirmed","Confirmed ✓"],completed:["s-completed","Completed — thank you!"],canceled:["s-canceled","Canceled"]};
var LINE={requested:"We've got your requested window. We group nearby visits together, so Derrick will reach out to confirm a narrower arrival time — and you'll get a text when he's on the way.",confirmed:"You're all set for your window. We'll text you when Derrick is on the way with a closer arrival time.",completed:"Thanks for choosing WeCare Landscapes. We'd love a review if you have a minute!",canceled:"This booking was canceled. Give us a call anytime to reschedule."};
function render(c){
  var box=document.getElementById("card");
  if(!c || !c.found){ box.innerHTML='<img class="logo" src="img/logo.png" alt="WeCare Landscapes"><h1>Booking not found</h1><div class="msg">We couldn\'t find this booking. Give us a call and we\'ll sort it out.</div><a class="call" href="tel:5016274384">📞 Call (501) 627-4384</a>'; return; }
  var st=STEP[c.status]||STEP.requested;
  var fn=c.firstName||"there";
  box.innerHTML='<img class="logo" src="img/logo.png" alt="WeCare Landscapes">'+
    '<h1>Hi '+esc(fn)+'! 👋</h1>'+
    '<div class="msg">Here\'s your consultation with WeCare Landscapes.</div>'+
    '<div class="step '+st[0]+'">'+st[1]+'</div>'+
    '<div class="det">'+
      (c.service?'<div class="r"><span>Service</span><b>'+esc(c.service)+'</b></div>':'')+
      (c.date?'<div class="r"><span>Day</span><b>'+esc(fmtDate(c.date))+'</b></div>':'')+
      (c.time?'<div class="r"><span>Window</span><b>'+esc(fmtTime(c.time))+'</b></div>':'')+
      (c.address?'<div class="r"><span>Address</span><b>'+esc(c.address)+'</b></div>':'')+
    '</div>'+
    '<div class="msg">'+(LINE[c.status]||LINE.requested)+'</div>'+
    '<a class="call" href="tel:5016274384">📞 Call (501) 627-4384</a>'+
    '<div class="foot">WeCare Landscapes · in Central Arkansas</div>';
}
var everFound=false;
function fetchStatus(){
  if(!id){ render(null); return; }
  WeCareCloud.team("consult_status",{id:id}).then(function(c){
    if(c && c.found){ everFound=true; render(c); }
    else if(!everFound){ render(null); }
  }).catch(function(){ if(!everFound) render(null); });
}
fetchStatus();
setInterval(fetchStatus, 8000);
</script>
</body>
</html>
